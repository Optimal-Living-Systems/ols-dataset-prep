[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ols-dataset-prep"
version = "0.1.0"
description = "OLS Dataset Preparation Pipeline — HuggingFace to Unsloth Studio"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

dependencies = [
    # CRITICAL: <4.5 keeps trust_remote_code support for legacy .py script datasets
    "datasets>=3.0,<4.5",
    "huggingface-hub>=0.20",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Handle zstd compression if needed outside of datasets
    "zstandard>=0.22",
    # Augmentation — Phase 3 (listed here so the import doesn't crash the stub)
    "distilabel[anthropic,ollama]>=1.0",
    # Observability — Phase 4 (stub in Phase 1)
    "langfuse>=2.0",
]

[project.scripts]
ols-prep = "ols_dataset_prep.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ols_dataset_prep"]
